name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Runs against the synthetic fixtures only. The real customer reports are
      # not in the repository, so those assertions skip here by design.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
